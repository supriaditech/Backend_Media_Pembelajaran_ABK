services:
  mysql:
    image: mysql:8.4
    container_name: modiminds-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootmodiminds
      MYSQL_DATABASE: modiminds_db
    ports:
      - '3307:3306'
    volumes:
      - modiminds-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-prootmodiminds',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modiminds-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://root:rootmodiminds@mysql:3306/modiminds_db
    ports:
      - '3002:3002'
    volumes:
      - ./src/uploads:/usr/src/app/src/uploads
    command: sh -c "npx prisma migrate deploy && node dist/src/main"

volumes:
  modiminds-mysql-data:
